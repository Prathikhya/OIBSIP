<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- style sheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/style.css" />
    

  </head>

  <body>
    <header>
      <div class="header-cont">
        <div class="nav-top">
          <div>
            <span class="logo">BTSArmY</span>
          </div>

          <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              placeholder="Search for products, brands & more..."
            />
          </div>

          <div class="icons">
            <span><i class="fa-solid fa-user"></i></span>
            <span><i class="fa-solid fa-heart"></i></span>
            <span><i class="fa-solid fa-cart-shopping"></i></span>
          </div>
        </div>

        
      </div>
    </header>

    <main>
      <section class="hero">

        <div class="nav-bottom">
          <nav class="navlinks">
            <ul>
              <li><a href="#"  id="">Home</a></li>
              <li><a href="#"  id="">About</a></li>
              <li><a href="#"  id="">Services</a></li>
              <li><a href="#"  id="">Contact</a></li>
            </ul>
          </nav>
        </div>
        
          <div class="hero-content">
            <h1>
              Your World of Shopping <span class="start">Starts Here.</span>
            </h1>
            <p>
              Discover our amazing products and services. We provide the best
              solutions for your needs.
            </p>
            <a href="#" class="hero-btn"
              >Get Started <i class="fa-solid fa-arrow-right-long"></i>
            </a>
          
          
             <div class="features">
          <div class="features-container">
            <div class="feature">
              <i class="fa-solid fa-truck"></i>
              <h5>Fast Delivery</h5>
              </div>
            <div class="feature">
              <i class="fa-solid fa-shield"></i>
              <h5>Secure Payment</h5>
           </div>
            <div class="feature">
              <i class="fa-solid fa-thumbs-up"></i>
              <h5>Quality Products</h5>
             </div>
            <div class="feature">
              <i class="fa-solid fa-headset"></i>
              <h5>24/7 Support</h5>
             </div>
          </div>
        </div>
          
          
          
          </div>


        

       
      </section>


      <section class="categories-nav">

        <div class="category-nav">
          <img src="images/c1.png" alt="Category 1" />
          <a href="#">c1</a>
        </div>

        <div class="category-nav">
          <img src="images/c2.png" alt="Category 2" />
          <a href="#">c2</a>
        </div>

        <div class="category-nav">
          <img src="images/c3.png" alt="Category 3" />
          <a href="#">c3</a>
        </div>

      </section>
    </main>

  </body>
</html>
